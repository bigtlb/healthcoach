name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank to auto-detect nearest Git tag, e.g. v0.9.1)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI Installer
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseMsi --no-daemon

      - name: Code Sign Windows MSI Package
        if: env.WINDOWS_SIGNING_CERT_BASE64 != ''
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Decoding code signing certificate..."
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          $certPath = Join-Path $PWD "windows-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Locate signtool.exe from Windows SDK
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Warning "signtool.exe not found in standard Windows Kits path; falling back to PATH lookup."
            $signtool = "signtool"
          }
          Write-Host "Using SignTool at: $signtool"

          $msiFiles = Get-ChildItem -Path "desktopApp/build/compose/binaries/main-release/msi" -Filter "*.msi"
          foreach ($file in $msiFiles) {
            Write-Host "Signing $($file.FullName)..."
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $file.FullName
            & $signtool verify /pa /v $file.FullName
          }

          Remove-Item -Path $certPath -Force
          Write-Host "Code signing completed successfully."

      - name: Stage Windows Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp desktopApp/build/compose/binaries/main-release/msi/*.msi staging/
          ls -la staging/

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: staging/*.msi
          retention-days: 5

  build-linux-and-android:
    name: Build Linux DEB & RPM, Android APK & AAB Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install RPM Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Decode Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully."

      - name: Build Linux DEB & RPM and Android Packages
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon

      - name: Stage Linux and Android Artifacts
        run: |
          mkdir -p staging
          cp desktopApp/build/compose/binaries/main-release/deb/*.deb staging/ || true
          cp desktopApp/build/compose/binaries/main-release/rpm/*.rpm staging/ || true
          
          # Stage Android APK
          if compgen -G "androidApp/build/outputs/apk/release/*-signed.apk" > /dev/null; then
            cp androidApp/build/outputs/apk/release/*-signed.apk staging/HealthCoach.apk
          elif compgen -G "androidApp/build/outputs/apk/release/*.apk" > /dev/null; then
            cp androidApp/build/outputs/apk/release/*.apk staging/HealthCoach.apk
          fi
          
          # Stage Android App Bundle (.aab)
          if compgen -G "androidApp/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp androidApp/build/outputs/bundle/release/*.aab staging/HealthCoach.aab
          fi
          
          ls -la staging/

      - name: Upload Linux and Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-packages
          path: staging/*
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-and-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all staged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || git describe --tags --match "v*" --always 2>/dev/null || echo "v0.9.1")
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Generate Release Notes & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
