name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI Installer
        run: ./gradlew :desktopApp:packageReleaseMsi --no-daemon

      - name: Stage Windows Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp desktopApp/build/compose/binaries/main-release/msi/*.msi staging/
          ls -la staging/

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: staging/*.msi
          retention-days: 5

  build-linux-and-android:
    name: Build Linux DEB, Android APK & AAB Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully."

      - name: Build Linux DEB and Android Packages
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :desktopApp:packageReleaseDeb :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon

      - name: Stage Linux and Android Artifacts
        run: |
          mkdir -p staging
          cp desktopApp/build/compose/binaries/main-release/deb/*.deb staging/ || true
          
          # Stage Android APK
          if compgen -G "androidApp/build/outputs/apk/release/*-signed.apk" > /dev/null; then
            cp androidApp/build/outputs/apk/release/*-signed.apk staging/HealthCoach.apk
          elif compgen -G "androidApp/build/outputs/apk/release/*.apk" > /dev/null; then
            cp androidApp/build/outputs/apk/release/*.apk staging/HealthCoach.apk
          fi
          
          # Stage Android App Bundle (.aab)
          if compgen -G "androidApp/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp androidApp/build/outputs/bundle/release/*.aab staging/HealthCoach.aab
          fi
          
          ls -la staging/

      - name: Upload Linux and Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-packages
          path: staging/*
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-and-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all staged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Generate Release Notes & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
