name: Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave blank to auto-detect nearest Git tag, e.g. v0.9.1)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows MSI & Portable ZIP Packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI Installer and Portable Distributable
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseMsi :desktopApp:createReleaseDistributable --no-daemon

      - name: Code Sign Windows Binaries
        if: env.WINDOWS_SIGNING_CERT_BASE64 != ''
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          Write-Host "Decoding code signing certificate..."
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          $certPath = Join-Path $PWD "windows-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Locate signtool.exe from Windows SDK
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          if (-not $signtool) {
            Write-Warning "signtool.exe not found in standard Windows Kits path; falling back to PATH lookup."
            $signtool = "signtool"
          }
          Write-Host "Using SignTool at: $signtool"

          $msiFiles = Get-ChildItem -Path "desktopApp/build/compose/binaries/main-release/msi" -Filter "*.msi"
          foreach ($file in $msiFiles) {
            Write-Host "Signing $($file.FullName)..."
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $file.FullName
            & $signtool verify /pa /v $file.FullName
          }

          $exeFiles = Get-ChildItem -Path "desktopApp/build/compose/binaries/main-release/app" -Filter "*.exe" -Recurse
          foreach ($file in $exeFiles) {
            Write-Host "Signing $($file.FullName)..."
            & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $file.FullName
            & $signtool verify /pa /v $file.FullName
          }

          Remove-Item -Path $certPath -Force
          Write-Host "Code signing completed successfully."

      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item -Path "desktopApp/build/compose/binaries/main-release/msi/*.msi" -Destination staging/
          
          # Extract version from MSI filename (e.g., HealthCoach-0.9.7.msi -> 0.9.7)
          $msiFile = Get-ChildItem -Path "desktopApp/build/compose/binaries/main-release/msi/*.msi" | Select-Object -First 1
          $version = "0.0.1"
          if ($msiFile -and $msiFile.Name -match '^HealthCoach-(.+)\.msi$') {
            $version = $Matches[1]
          } elseif ($env:GITHUB_REF_NAME -match '^v?(.+)$') {
            $version = $Matches[1]
          }
          
          $distDir = "desktopApp/build/compose/binaries/main-release/app/HealthCoach"
          if (-not (Test-Path $distDir)) {
            $distDir = "desktopApp/build/compose/binaries/main-release/app"
          }
          if (Test-Path $distDir) {
            $zipName = "HealthCoach-$version-windows.zip"
            Write-Host "Creating portable Windows ZIP ($zipName) from $distDir..."
            Compress-Archive -Path "$distDir" -DestinationPath "staging/$zipName" -Force
          } else {
            Write-Warning "Distributable directory $distDir not found!"
          }
          Get-ChildItem -Path staging

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: staging/*
          retention-days: 5

  build-linux-and-android:
    name: Build Linux DEB, RPM & Flatpak, Android APK & AAB Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install Linux Packaging Tools
        run: |
          sudo apt-get update && sudo apt-get install -y rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Decode Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully."

      - name: Update Flatpak Manifests & AppStream Metadata
        id: sync_metadata
        run: |
          # 1. Resolve release version and tag
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            RAW_TAG="${{ github.ref_name }}"
          else
            RAW_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || git describe --tags --match "v*" --always 2>/dev/null || echo "v0.0.1")
          fi

          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION#V}"
          TODAY=$(date -u +"%Y-%m-%d")
          echo "Target Version: $VERSION (Tag: $RAW_TAG, Date: $TODAY)"

          # Ensure git tags are available for commit log resolution
          git fetch --tags --unshallow 2>/dev/null || git fetch --tags 2>/dev/null || true

          # 2. Extract commit history since previous tag, excluding CI chore / skip commits
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "^${RAW_TAG}$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${RAW_TAG}^" 2>/dev/null || true)
          fi
          echo "Previous Tag: $PREV_TAG"

          COMMITS_FILE="/tmp/release_commits.txt"
          if [ -n "$PREV_TAG" ]; then
            (git log "${PREV_TAG}..HEAD" --pretty=format:"* %s" --no-merges 2>/dev/null || git log -n 25 --pretty=format:"* %s" --no-merges) \
              | grep -v -i -E '\[(skip[ -]ci|ci[ -]skip)\]|chore\(release\):' > "$COMMITS_FILE" || true
          else
            git log -n 25 --pretty=format:"* %s" --no-merges \
              | grep -v -i -E '\[(skip[ -]ci|ci[ -]skip)\]|chore\(release\):' > "$COMMITS_FILE" || true
          fi

          # 3. Synchronize AppStream metadata (retaining the 3 most recent releases)
          python3 - "$VERSION" "$TODAY" "$COMMITS_FILE" "packaging/flatpak/com.lbthomas.healthcoach.metainfo.xml" << 'EOF'
          import sys, xml.etree.ElementTree as ET

          version = sys.argv[1]
          release_date = sys.argv[2]
          commits_file = sys.argv[3]
          xml_path = sys.argv[4]

          commits = []
          try:
              with open(commits_file, 'r', encoding='utf-8') as f:
                  for line in f:
                      line = line.strip()
                      if line.startswith('* '):
                          line = line[2:]
                      if line:
                          commits.append(line)
          except FileNotFoundError:
              pass

          tree = ET.parse(xml_path)
          root = tree.getroot()
          releases_node = root.find('releases')
          if releases_node is None:
              releases_node = ET.SubElement(root, 'releases')

          for rel in list(releases_node.findall('release')):
              if rel.attrib.get('version') == version:
                  releases_node.remove(rel)

          new_release = ET.Element('release', {'version': version, 'date': release_date})
          desc_node = ET.SubElement(new_release, 'description')
          if commits:
              ul_node = ET.SubElement(desc_node, 'ul')
              for commit in commits:
                  li_node = ET.SubElement(ul_node, 'li')
                  li_node.text = commit
          else:
              p_node = ET.SubElement(desc_node, 'p')
              p_node.text = f"HealthCoach version {version} release."

          releases_node.insert(0, new_release)

          all_releases = releases_node.findall('release')
          if len(all_releases) > 3:
              for old_rel in all_releases[3:]:
                  releases_node.remove(old_rel)

          ET.indent(tree, space="    ", level=0)
          tree.write(xml_path, encoding='utf-8', xml_declaration=True)
          EOF

          # 4. Update version patterns in Flatpak YAML manifests
          for manifest in packaging/flatpak/*.yml; do
            if [ -f "$manifest" ]; then
              sed -i -E "s/(v)[0-9]+\.[0-9]+\.[0-9]+/\1${VERSION}/g" "$manifest" || true
              sed -i -E "s/HealthCoach-[0-9]+\.[0-9]+\.[0-9]+/HealthCoach-${VERSION}/g" "$manifest" || true
            fi
          done

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Commit and Push Metadata Updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packaging/flatpak/

          if ! git diff --cached --quiet; then
            VERSION="${{ steps.sync_metadata.outputs.version }}"
            git commit -m "chore(release): update Flatpak manifest and AppStream metadata to v${VERSION} [skip ci]"

            if [ "${{ github.ref_type }}" = "branch" ]; then
              git push origin HEAD:${{ github.ref_name }}
            else
              TARGET_BRANCH="${{ github.event.repository.default_branch }}"
              [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"
              git push origin HEAD:${TARGET_BRANCH}
            fi
          else
            echo "No changes detected in packaging/flatpak/ to commit."
          fi

      - name: Build Linux (DEB, RPM, Flatpak) and Android Packages
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm :desktopApp:packageFlatpakBundle :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon

      - name: Stage Linux and Android Artifacts
        run: |
          mkdir -p staging
          cp desktopApp/build/compose/binaries/main-release/deb/*.deb staging/ || true
          cp desktopApp/build/compose/binaries/main-release/rpm/*.rpm staging/ || true
          cp desktopApp/build/flatpak/*.flatpak staging/ || true
          
          # Determine package version from generated native packages, tags, or fallback
          VERSION=""
          if compgen -G "desktopApp/build/compose/binaries/main-release/deb/healthcoach_*_amd64.deb" > /dev/null; then
            DEB_FILE=$(ls desktopApp/build/compose/binaries/main-release/deb/healthcoach_*_amd64.deb | head -n 1)
            DEB_BASENAME=$(basename "$DEB_FILE")
            if [[ "$DEB_BASENAME" =~ healthcoach_(.+)_amd64\.deb ]]; then
              VERSION="${BASH_REMATCH[1]}"
            fi
          fi
          if [ -z "$VERSION" ] && compgen -G "desktopApp/build/flatpak/HealthCoach-*.flatpak" > /dev/null; then
            FLATPAK_FILE=$(ls desktopApp/build/flatpak/HealthCoach-*.flatpak | head -n 1)
            FLATPAK_BASENAME=$(basename "$FLATPAK_FILE")
            if [[ "$FLATPAK_BASENAME" =~ HealthCoach-(.+)\.flatpak ]]; then
              VERSION="${BASH_REMATCH[1]}"
            fi
          fi
          if [ -z "$VERSION" ]; then
            TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || git describe --tags --match "v*" --always 2>/dev/null || echo "0.0.1")
            VERSION="${TAG#v}"
          fi
          echo "Detected release version for Android packaging: $VERSION"
          
          # Create portable Linux tarball for Flathub
          cp desktopApp/src/main/resources/scales.png desktopApp/build/compose/binaries/main-release/app/HealthCoach/scales.png
          tar -czvf "staging/HealthCoach-${VERSION}-linux-x64.tar.gz" -C desktopApp/build/compose/binaries/main-release/app HealthCoach
          
          # Stage Android APK
          if compgen -G "androidApp/build/outputs/apk/release/*-signed.apk" > /dev/null; then
            cp androidApp/build/outputs/apk/release/*-signed.apk "staging/HealthCoach-${VERSION}.apk"
          elif compgen -G "androidApp/build/outputs/apk/release/*.apk" > /dev/null; then
            cp androidApp/build/outputs/apk/release/*.apk "staging/HealthCoach-${VERSION}.apk"
          fi
          
          # Stage Android App Bundle (.aab)
          if compgen -G "androidApp/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp androidApp/build/outputs/bundle/release/*.aab "staging/HealthCoach-${VERSION}.aab"
          fi
          
          ls -la staging/

      - name: Upload Linux and Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android-packages
          path: staging/*
          retention-days: 5

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-and-android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all staged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded release assets
        run: ls -la release-assets/

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || git describe --tags --match "v*" --always 2>/dev/null || echo "v0.9.1")
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Generate Changelog & Release Notes
        id: generate_notes
        run: |
          TARGET_TAG="${{ steps.release_tag.outputs.tag }}"
          echo "Target tag: $TARGET_TAG"
          
          # Ensure git history and tags are available
          git fetch --tags --unshallow 2>/dev/null || git fetch --tags 2>/dev/null || true
          
          # Find the previous release tag before TARGET_TAG
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "^${TARGET_TAG}$" | head -n 1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${TARGET_TAG}^" 2>/dev/null || true)
          fi
          
          echo "Previous tag: $PREV_TAG"
          
          NOTES_FILE="RELEASE_NOTES.md"
          
          echo "### HealthCoach ${TARGET_TAG}" > $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "Local-first health and wellness tracking application for Desktop and Android." >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "#### Downloads & Packaging" >> $NOTES_FILE
          echo "- **Windows**: \`.msi\` installer and standalone \`.zip\` portable archive (with bundled JRE & native SQLite drivers)." >> $NOTES_FILE
          echo "- **Linux**: Standalone \`.flatpak\` bundle, Debian/Ubuntu \`.deb\`, and Fedora/RHEL \`.rpm\` packages." >> $NOTES_FILE
          echo "- **Android**: Standalone universal \`.apk\` and Google Play \`.aab\` bundle." >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "#### ⚠️ Unsigned Windows Notice & SmartScreen Workaround" >> $NOTES_FILE
          echo "Windows packages are currently unsigned. On first launch, Windows Defender SmartScreen may display *\"Windows protected your PC\"*." >> $NOTES_FILE
          echo "- **MSI Installer**: Click **More info** → **Run anyway**." >> $NOTES_FILE
          echo "- **Portable ZIP**: Right-click the downloaded \`.zip\` archive → **Properties** → check **Unblock** → **Apply** before extracting and running \`HealthCoach.exe\`." >> $NOTES_FILE
          echo "- For full details and documentation, visit [https://bigtlb.github.io/healthcoach/](https://bigtlb.github.io/healthcoach/)." >> $NOTES_FILE
          echo "" >> $NOTES_FILE
          echo "#### Changelog" >> $NOTES_FILE
          
          if [ -n "$PREV_TAG" ]; then
            echo "Commits since **${PREV_TAG}**:" >> $NOTES_FILE
            echo "" >> $NOTES_FILE
            (git log "${PREV_TAG}..${TARGET_TAG}" --pretty=format:"* %s (%h)" --no-merges 2>/dev/null || git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h)" --no-merges 2>/dev/null || git log -n 25 --pretty=format:"* %s (%h)" --no-merges) | grep -v -i -E '\[(skip[ -]ci|ci[ -]skip)\]|chore\(release\):' >> $NOTES_FILE || true
          else
            echo "Commits for **${TARGET_TAG}**:" >> $NOTES_FILE
            echo "" >> $NOTES_FILE
            (git log "${TARGET_TAG}" --pretty=format:"* %s (%h)" --no-merges 2>/dev/null || git log -n 25 --pretty=format:"* %s (%h)" --no-merges) | grep -v -i -E '\[(skip[ -]ci|ci[ -]skip)\]|chore\(release\):' >> $NOTES_FILE || true
          fi
          
          echo "" >> $NOTES_FILE
          cat $NOTES_FILE

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: false
