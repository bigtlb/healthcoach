name: Main Branch Build & Verification

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'OPEN_SOURCE_LICENSES.txt'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Verify & Package Linux Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install RPM Packaging Tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Run verification checks (Unit Tests, Android Lint, SqlDelight Migrations)
        run: ./gradlew check test --no-daemon

      - name: Build Linux Release Distribution (DEB & RPM)
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS --no-daemon

      - name: Upload Test & Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-build-verification-reports
          path: |
            **/build/reports/
            **/build/outputs/lint-results*
            desktopApp/build/compose/logs/
          retention-days: 7
