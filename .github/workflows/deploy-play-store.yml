name: Deploy to Google Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track on Google Play'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      user_fraction:
        description: 'User fraction for staged rollout (e.g., 0.1 for 10%, 1.0 for 100%)'
        required: false
        default: '1.0'
        type: string
      whats_new:
        description: 'Release Notes (What’s New in this version)'
        required: false
        default: 'Performance improvements and bug fixes.'
        type: string

concurrency:
  group: deploy-play-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Upload Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully."

      - name: Build Signed Android App Bundle (.aab)
        env:
          GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.GOOGLE_CLIENT_ID_DESKTOP }}
          GOOGLE_CLIENT_SECRET_DESKTOP: ${{ vars.GOOGLE_CLIENT_SECRET_DESKTOP }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ vars.GOOGLE_CLIENT_ID_ANDROID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:bundleRelease --no-daemon

      - name: Prepare Release Notes
        run: |
          mkdir -p distribution/whatsnew
          echo "${{ inputs.whats_new }}" > distribution/whatsnew/whatsnew-en-US

      - name: Upload App Bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.lbthomas.healthcoach
          releaseFiles: androidApp/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          userFraction: ${{ inputs.user_fraction }}
          whatsNewDirectory: distribution/whatsnew
          status: completed
