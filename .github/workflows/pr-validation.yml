name: PR Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run verification checks (Unit Tests, Android Lint, SqlDelight Migrations)
        run: ./gradlew check test --no-daemon

      - name: Upload Test & Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-verification-reports
          path: |
            **/build/reports/
            **/build/outputs/lint-results*
          retention-days: 7
