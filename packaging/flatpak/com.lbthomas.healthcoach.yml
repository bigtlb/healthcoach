id: com.lbthomas.healthcoach
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: HealthCoach


finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri

  - --share=network
  - --system-talk-name=org.freedesktop.Avahi

  - --filesystem=xdg-documents
  - --filesystem=xdg-download

modules:
  - name: healthcoach
    buildsystem: simple
    build-commands:
      - cp -r bin /app/
      - cp -r lib /app/
      - install -D -m 0644 scales.png /app/share/icons/hicolor/256x256/apps/com.lbthomas.healthcoach.png
      - install -D -m 0644 com.lbthomas.healthcoach.desktop /app/share/applications/com.lbthomas.healthcoach.desktop
      - install -D -m 0644 com.lbthomas.healthcoach.metainfo.xml /app/share/metainfo/com.lbthomas.healthcoach.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/bigtlb/healthcoach/releases/download/v0.9.20/HealthCoach-0.9.20-linux-x64.tar.gz
        sha256: e7d1a6fe7dab5b8242923638a60d6627add505f7a8641de55c8388d21b72d956
        only-arches:
          - x86_64

      - type: file
        path: com.lbthomas.healthcoach.desktop

      - type: file
        path: com.lbthomas.healthcoach.metainfo.xml